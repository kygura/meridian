<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Meridian</title>
    <script>
      // Apply the saved theme before first paint (see src/shell/theme.ts).
      try {
        var saved = JSON.parse(localStorage.getItem("meridian.theme") || "null");
        var pref = saved && saved.state && saved.state.pref;
        if (pref === "light" || pref === "dark" || pref === "system") {
          document.documentElement.setAttribute("data-theme", pref);
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#c2680c" />
    <meta name="description" content="A personal travel planner on a world map." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meridian" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
