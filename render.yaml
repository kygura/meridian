services:
  - type: web
    name: meridian
    env: node
    plan: starter
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: MERIDIAN_TOKEN
        sync: false
      # One proxy hop in front of the service: rate limits and the sign-in lockout
      # then count per visitor (ADR 0009).
      - key: TRUST_PROXY
        value: 1
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: DUFFEL_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
    disk:
      name: meridian-data
      mountPath: /var/data
      sizeGB: 1
  # Watches (spec-journal §10): no in-process timer. Something must POST
  # /api/watches/run daily with the Bearer token: a Render Cron Job (paid) or a
  # scheduled Claude task. Not provisioned here. (On Vercel, the cron in
  # scripts/build-vercel.mjs does it.)
