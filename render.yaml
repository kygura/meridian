services:
  - type: web
    name: meridian
    env: node
    plan: starter
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENAI_API_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: meridian-data
      mountPath: /var/data
      sizeGB: 1
